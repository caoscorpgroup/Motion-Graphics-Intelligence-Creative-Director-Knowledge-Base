# This repository contains browser-oriented JavaScript demonstrations, not a Deno application.
# Keep this workflow focused on syntax validation without imposing Deno-specific lint rules
# on browser globals or rewriting historical experiments.

name: JavaScript syntax validation

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
            count=$((count + 1))
          done < <(find entregas -type f -name '*.js' -print0)
          echo "Validated $count JavaScript files."
