# Validate the repository's Python asset-inspection utilities and their tests.

name: Python asset tools

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest Pillow

      - name: Check Python syntax and undefined names
        run: |
          python -m compileall -q tools tests
          flake8 tools tests --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run asset inspection tests
        run: pytest -q
