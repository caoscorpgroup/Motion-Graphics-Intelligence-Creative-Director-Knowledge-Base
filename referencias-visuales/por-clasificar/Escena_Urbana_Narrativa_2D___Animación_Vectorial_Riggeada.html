<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Escena Urbana Narrativa 2D — Animación Vectorial Riggeada</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
  
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body, #root {
      width: 100%;
      height: 100%;
      background-color: #050a14;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      color: #e4effa;
      user-select: none;
    }

    .viewport-stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #0d1d33 0%, #050a14 100%);
    }

    .canvas-frame {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 177.78vh;
      max-height: 56.25vw;
      box-shadow: 0 28px 90px rgba(0, 0, 0, 0.88), 0 0 0 1px rgba(122, 184, 224, 0.16);
      border-radius: 6px;
      overflow: hidden;
      background-color: #071224;
    }

    svg.narrative-scene {
      width: 100%;
      height: 100%;
      display: block;
      shape-rendering: geometricPrecision;
    }

    .sign-condensed {
      font-family: 'Oswald', sans-serif;
      letter-spacing: 0.06em;
    }

    /* Barra de control flotante minimalista en la parte inferior */
    .production-bar {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 60;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(8, 18, 34, 0.82);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(136, 196, 236, 0.22);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.65);
      max-width: 94vw;
      transition: opacity 0.25s ease;
    }

    .ctrl-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 30px;
      padding: 0 11px;
      border-radius: 999px;
      border: 1px solid rgba(136, 196, 236, 0.22);
      background: rgba(20, 42, 72, 0.65);
      color: #dcebf9;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s ease;
      white-space: nowrap;
    }

    .ctrl-btn:hover {
      background: rgba(34, 68, 112, 0.9);
      border-color: rgba(255, 209, 102, 0.6);
      color: #ffffff;
    }

    .ctrl-btn.primary {
      background: #ffd166;
      border-color: #ffe39e;
      color: #071224;
    }

    .ctrl-btn.primary:hover {
      background: #ffe08a;
    }

    .ctrl-btn.active-toggle {
      background: rgba(244, 162, 97, 0.24);
      border-color: #f4a261;
      color: #ffd166;
    }

    .timeline-box {
      display: flex;
      flex-direction: column;
      gap: 3px;
      width: 260px;
      min-width: 140px;
    }

    .timeline-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      color: #8cb7db;
      font-variant-numeric: tabular-nums;
    }

    .beat-badge {
      color: #ffd166;
      font-weight: 600;
    }

    input[type="range"].scrubber {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 5px;
      border-radius: 999px;
      background: rgba(136, 196, 236, 0.22);
      outline: none;
      cursor: pointer;
    }

    input[type="range"].scrubber::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #ffd166;
      border: 2px solid #071224;
      box-shadow: 0 0 8px rgba(255, 209, 102, 0.7);
      cursor: pointer;
    }

    .speed-group {
      display: inline-flex;
      background: rgba(12, 26, 48, 0.75);
      border-radius: 999px;
      padding: 2px;
      border: 1px solid rgba(136, 196, 236, 0.16);
    }

    .speed-pill {
      padding: 3px 7px;
      border-radius: 999px;
      border: none;
      background: transparent;
      color: #8cb7db;
      font-size: 10.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .speed-pill.active {
      background: #2c599d;
      color: #ffffff;
    }

    /* Panel lateral opcional para inspección de capas */
    .layers-popover {
      position: fixed;
      bottom: 66px;
      right: 24px;
      z-index: 65;
      width: 240px;
      padding: 12px;
      border-radius: 12px;
      background: rgba(8, 18, 34, 0.9);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(136, 196, 236, 0.25);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
      font-size: 11.5px;
    }

    .layers-popover h4 {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #8cb7db;
      margin-bottom: 8px;
    }

    .layer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 6px;
      border-radius: 6px;
      cursor: pointer;
    }

    .layer-row:hover {
      background: rgba(44, 89, 157, 0.25);
    }

    .layer-row input {
      accent-color: #ffd166;
    }

    @media (max-width: 760px) {
      .timeline-box {
        width: 140px;
      }
      .speed-group {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    /**
     * ============================================================================
     * PALETA CROMÁTICA Y CONSTANTES DE DIRECCIÓN ARTÍSTICA
     * Mantiene estrictamente la identidad nocturna azul/cian y luz cálida ámbar.
     * ============================================================================
     */
    const THEME = {
      ink: '#050B16',
      inkSoft: '#0D1C33',
      skyTop: '#071224',
      skyMid: '#0E2240',
      skyHorizon: '#193966',
      farSilhouette: '#0A1930',
      farBuilding: '#0E2240',
      midBuilding: '#142E54',
      midBuildingDark: '#0D203D',
      fgBuilding: '#1B3B6B',
      fgBuildingShadow: '#11284B',
      fgTrim: '#254E8A',
      sidewalkTop: '#2C599D',
      sidewalkSide: '#153159',
      roadBase: '#12294A',
      roadHighlight: '#1D3F70',
      crosswalk: '#7BA3D6',
      warmCore: '#FFF3B0',
      warmMid: '#FFD166',
      warmAmber: '#F4A261',
      ironDark: '#091426',
      ironHighlight: '#244A80',
      // Protagonista
      beanieMain: '#E09F3E',
      beanieRib: '#C28127',
      hairDark: '#161B2E',
      hairHighlight: '#283252',
      skin: '#F2C3A7',
      skinShadow: '#D49B7D',
      coatMain: '#24558A',
      coatShade: '#173A61',
      scarfMain: '#D95D39',
      scarfShade: '#B04323',
      pantsMain: '#102542',
      pantsShade: '#0A182B',
      bootsMain: '#C86D51',
      bootsSole: '#0D1829',
      // Perro salchicha (Dachshund)
      dogCoat: '#9E472A',
      dogCoatShade: '#7A331C',
      dogTan: '#D48C5A',
      dogCollar: '#E63946',
      dogTag: '#FFD166'
    };

    const LOOP_DURATION = 9.0; // Bucle continuo exacto de 9.0 segundos

    /**
     * ============================================================================
     * FUNCIONES MATEMÁTICAS DE INTERPOLACIÓN Y CINEMÁTICA PERIÓDICA
     * Garantizan continuidad C∞ entre t = 0.0s y t = 9.0s sin saltos.
     * ============================================================================
     */
    const clamp01 = (v) => Math.max(0, Math.min(1, v));
    const smoothstep = (edge0, edge1, x) => {
      const t = clamp01((x - edge0) / (edge1 - edge0));
      return t * t * (3 - 2 * t);
    };

    /**
     * Calcula todos los parámetros articulares y ambientales para un instante `t` en [0, 9).
     */
    function evaluateRigState(t) {
      const TAU = Math.PI * 2;
      // 9 ciclos de paso completos en 9.0 segundos -> frecuencia exacta de 1.0 Hz (1 ciclo de 2 pasos / seg)
      const walkFreq = 1.0;
      const walkPhase = TAU * walkFreq * t;

      // Envolvente narrativa de interacción de miradas entre t = 3.2s y t = 6.6s
      const lookIn = smoothstep(3.2, 4.1, t);
      const lookOut = 1 - smoothstep(5.8, 6.7, t);
      const interactionWeight = lookIn * lookOut; // 0 fuera de interacción, 1 en el clímax (4.1s - 5.8s)

      // Avance sutil en bucle cerrado con retorno elástico imperceptible para sensación de progreso
      const strideDriftX = Math.sin((TAU * t) / LOOP_DURATION) * 14;

      // --- 1. CINEMÁTICA DE LA PROTAGONISTA ---
      // Doble rebote vertical por cada ciclo completo de 2 pasos (cos(2 * phase))
      const girlBobY = -Math.abs(Math.sin(walkPhase)) * 6.5;
      const girlPelvisTilt = Math.sin(walkPhase) * 2.2;
      const girlTorsoTilt = 2.5 + Math.cos(walkPhase) * 2.4 + interactionWeight * 4.5;

      // Cabeza: cabeceo rítmico + inclinación cariñosa hacia abajo/derecha al mirar al perro
      const girlHeadTilt =
        -1.5 +
        Math.sin(walkPhase - 0.5) * 2.2 +
        interactionWeight * 15.5;

      // Movimiento secundario (follow-through) de cabello y bufanda con desfase
      const hairBackSway = -4 + Math.sin(walkPhase - 1.1) * 7.5 - interactionWeight * 4;
      const hairFrontSway = Math.sin(walkPhase - 0.8) * 4.5 + interactionWeight * 6;
      const scarfTailAngle = -6 + Math.sin(walkPhase - 1.3) * 11 + Math.sin(TAU * 2 * t) * 2.5;

      // Pierna izquierda (ciclo de marcha con flexión de rodilla en fase de recobro)
      const thighLAngle = Math.sin(walkPhase) * 24;
      const shinLAngle = Math.max(0, -Math.cos(walkPhase)) * 34 + 4;
      const footLAngle = -thighLAngle * 0.45 - shinLAngle * 0.35;

      // Pierna derecha (desfasada 180° = Math.PI)
      const thighRAngle = Math.sin(walkPhase + Math.PI) * 24;
      const shinRAngle = Math.max(0, -Math.cos(walkPhase + Math.PI)) * 34 + 4;
      const footRAngle = -thighRAngle * 0.45 - shinRAngle * 0.35;

      // Brazo derecho (balanceo libre opuesto a la pierna derecha)
      const armRAngle = Math.sin(walkPhase) * 22;
      const forearmRAngle = -12 - Math.max(0, Math.sin(walkPhase)) * 14;

      // Brazo izquierdo (sostiene la correa, movimiento amortiguado + ligero gesto al mirar al perro)
      const armLAngle = -14 + Math.sin(walkPhase + Math.PI) * 7 + interactionWeight * 6;
      const forearmLAngle = -22 + Math.cos(walkPhase) * 6 - interactionWeight * 5;

      // Cálculo aproximado de la posición mundial de la mano izquierda para anclar la correa
      const baseGirlX = 565 + strideDriftX;
      const baseGirlY = 582 + girlBobY;
      const handWorldX = baseGirlX + 34 + Math.sin((armLAngle + forearmLAngle) * (Math.PI / 180)) * 22;
      const handWorldY = baseGirlY + 28 + Math.cos(armLAngle * (Math.PI / 180)) * 18;

      // --- 2. CINEMÁTICA DEL PERRO SALCHICHA (DACHSHUND) ---
      // Frecuencia de trote ligeramente más rápida (2.0 Hz = 18 ciclos exactos en 9s -> bucle perfecto)
      const dogFreq = 2.0;
      const dogPhase = TAU * dogFreq * t;
      const dogLeadDrift = Math.sin((TAU * t) / LOOP_DURATION + 0.6) * 18;

      const dogX = 768 + strideDriftX + dogLeadDrift;
      const dogY = 696 - Math.abs(Math.sin(dogPhase)) * 4.2;
      const dogSpineTilt = Math.sin(dogPhase) * 2.6 - interactionWeight * 2.5;

      // Cabeza y cuello: mira al frente y levanta el hocico hacia la chica durante la interacción
      const dogNeckAngle = -6 + Math.cos(dogPhase - 0.4) * 3.5 - interactionWeight * 16;
      const dogHeadAngle = 4 + Math.sin(dogPhase - 0.6) * 3 - interactionWeight * 18;
      const dogEarFlop = Math.sin(dogPhase - 1.0) * 9 + interactionWeight * 5;

      // Cola: meneo alegre continuo, acelera a 4 Hz cuando cruzan miradas
      const tailFreq = 3.0;
      const tailAmplitude = 16 + interactionWeight * 14;
      const dogTailAngle = -24 + Math.sin(TAU * tailFreq * t) * tailAmplitude;

      // 4 patas cuadrúpedas coordinadas
      const dogFrontL = Math.sin(dogPhase) * 26;
      const dogFrontR = Math.sin(dogPhase + Math.PI) * 26;
      const dogBackL = Math.sin(dogPhase + Math.PI * 0.85) * 26;
      const dogBackR = Math.sin(dogPhase - Math.PI * 0.15) * 26;

      // Coordenadas mundiales del anillo del collar del perro
      const collarWorldX = dogX + 34 - interactionWeight * 4;
      const collarWorldY = dogY - 14 - interactionWeight * 5;

      // --- 3. AMBIENTE Y DETALLES SECUNDARIOS ---
      const starTwinklePhase = TAU * (1 / 3) * t;
      const lampFlicker = 0.94 + Math.sin(TAU * 2 * t) * 0.04 + Math.cos(TAU * 5 * t) * 0.02;
      const groundScroll = (t / LOOP_DURATION) * 1440; // Desplazamiento continuo cíclico para partículas/hojas

      return {
        t,
        interactionWeight,
        girl: {
          x: baseGirlX,
          y: baseGirlY,
          pelvisTilt: girlPelvisTilt,
          torsoTilt: girlTorsoTilt,
          headTilt: girlHeadTilt,
          hairBackSway,
          hairFrontSway,
          scarfTailAngle,
          thighLAngle,
          shinLAngle,
          footLAngle,
          thighRAngle,
          shinRAngle,
          footRAngle,
          armLAngle,
          forearmLAngle,
          armRAngle,
          forearmRAngle,
          isSmiling: interactionWeight > 0.25,
          eyeLookDown: interactionWeight
        },
        dog: {
          x: dogX,
          y: dogY,
          spineTilt: dogSpineTilt,
          neckAngle: dogNeckAngle,
          headAngle: dogHeadAngle,
          earFlop: dogEarFlop,
          tailAngle: dogTailAngle,
          frontL: dogFrontL,
          frontR: dogFrontR,
          backL: dogBackL,
          backR: dogBackR,
          eyeLookUp: interactionWeight
        },
        leash: {
          startX: handWorldX,
          startY: handWorldY,
          endX: collarWorldX,
          endY: collarWorldY,
          swing: Math.sin(walkPhase - 0.7) * 7
        },
        env: {
          starTwinklePhase,
          lampFlicker,
          groundScroll,
          steamPhase: TAU * (2 / 9) * t
        }
      };
    }

    /**
     * ============================================================================
     * DEFINICIONES SVG (GRADIENTES Y FILTROS DE ATMÓSFERA NOCTURNA)
     * ============================================================================
     */
    const SceneDefs = () => (
      <defs>
        <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stopColor={THEME.skyTop} />
          <stop offset="55%" stopColor={THEME.skyMid} />
          <stop offset="100%" stopColor={THEME.skyHorizon} />
        </linearGradient>

        <linearGradient id="warmWindowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stopColor={THEME.warmAmber} />
          <stop offset="38%" stopColor={THEME.warmMid} />
          <stop offset="100%" stopColor={THEME.warmCore} />
        </linearGradient>

        <radialGradient id="lampHaloGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stopColor={THEME.warmCore} stopOpacity="0.9" />
          <stop offset="28%" stopColor={THEME.warmMid} stopOpacity="0.38" />
          <stop offset="68%" stopColor={THEME.warmAmber} stopOpacity="0.11" />
          <stop offset="100%" stopColor={THEME.warmAmber} stopOpacity="0" />
        </radialGradient>

        <radialGradient id="groundPoolGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stopColor="#FFF3B0" stopOpacity="0.88" />
          <stop offset="60%" stopColor="#FFD166" stopOpacity="0.45" />
          <stop offset="100%" stopColor="#F4A261" stopOpacity="0" />
        </radialGradient>

        <linearGradient id="roadAsphaltGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stopColor="#0C1D36" />
          <stop offset="45%" stopColor={THEME.roadBase} />
          <stop offset="100%" stopColor="#193966" />
        </linearGradient>

        <linearGradient id="shopGlowLeft" x1="0%" y1="50%" x2="100%" y2="50%">
          <stop offset="0%" stopColor="#FFD166" stopOpacity="0.30" />
          <stop offset="100%" stopColor="#FFD166" stopOpacity="0" />
        </linearGradient>

        <linearGradient id="shopGlowRight" x1="100%" y1="50%" x2="0%" y2="50%">
          <stop offset="0%" stopColor="#FFD166" stopOpacity="0.28" />
          <stop offset="100%" stopColor="#FFD166" stopOpacity="0" />
        </linearGradient>
      </defs>
    );

    /**
     * ============================================================================
     * CAPA 1: CIELO NOCTURNO, ESTRELLAS, LUNA Y HORIZONTE LEJANO
     * ============================================================================
     */
    const SkyLayer = ({ env }) => {
      const stars = useMemo(() => [
        { x: 470, y: 46, r: 1.5, ph: 0.2 }, { x: 525, y: 92, r: 1.2, ph: 1.4 },
        { x: 582, y: 38, r: 1.8, ph: 2.3 }, { x: 635, y: 115, r: 1.3, ph: 0.8 },
        { x: 685, y: 62, r: 1.7, ph: 3.1 }, { x: 730, y: 30, r: 1.2, ph: 1.9 },
        { x: 775, y: 98, r: 2.0, ph: 0.5 }, { x: 822, y: 52, r: 1.4, ph: 2.7 },
        { x: 868, y: 124, r: 1.2, ph: 1.1 }, { x: 912, y: 44, r: 1.7, ph: 3.8 },
        { x: 955, y: 84, r: 1.3, ph: 2.1 }, { x: 610, y: 162, r: 1.2, ph: 0.9 }
      ], []);

      return (
        <g id="SkyLayer">
          <rect x="0" y="0" width="1440" height="520" fill="url(#skyGrad)" />

          {/* Luna creciente suave */}
          <g id="crescent-moon" transform="translate(888, 76)">
            <circle cx="0" cy="0" r="24" fill={THEME.warmCore} opacity="0.14" />
            <path
              d="M -4 -16 A 16 16 0 1 0 14 10 A 13 13 0 1 1 -4 -16 Z"
              fill={THEME.warmCore}
              stroke={THEME.ink}
              strokeWidth="1.5"
            />
          </g>

          {/* Estrellas con parpadeo periódico suave */}
          <g id="sky-stars">
            {stars.map((s, i) => {
              const opacity = 0.45 + 0.5 * (0.5 + 0.5 * Math.sin(env.starTwinklePhase + s.ph));
              return (
                <circle key={i} cx={s.x} cy={s.y} r={s.r} fill="#F2F7FF" opacity={opacity} />
              );
            })}
          </g>

          {/* Horizonte lejano de edificios en el punto de fuga (x=720, y=420) */}
          <g id="distant-skyline" stroke={THEME.ink} strokeWidth="1.8" strokeLinejoin="round">
            <path
              d="M 595 510 L 595 340 L 626 340 L 626 312 L 648 312 L 648 292 L 660 292 L 660 312 L 678 312 L 678 358 L 710 358 L 710 382 L 744 382 L 744 352 L 770 352 L 770 326 L 802 326 L 802 365 L 835 365 L 835 510 Z"
              fill={THEME.farSilhouette}
            />
            <rect x="638" y="328" width="8" height="12" fill={THEME.warmMid} strokeWidth="1.2" />
            <rect x="690" y="372" width="7" height="11" fill={THEME.warmAmber} strokeWidth="1.2" />
            <rect x="780" y="344" width="8" height="12" fill={THEME.warmMid} strokeWidth="1.2" />
            <rect x="780" y="366" width="8" height="12" fill={THEME.warmCore} strokeWidth="1.2" />
            <rect x="812" y="380" width="7" height="11" fill={THEME.warmMid} strokeWidth="1.2" />
          </g>
        </g>
      );
    };

    /**
     * ============================================================================
     * CAPA 2: ARQUITECTURA DEL PLANO INTERMEDIO EN PERSPECTIVA
     * ============================================================================
     */
    const MidgroundArchitectureLayer = () => (
      <g id="MidgroundArchitectureLayer" stroke={THEME.ink} strokeLinejoin="round" strokeLinecap="round">
        {/* --- BLOQUE INTERMEDIO IZQUIERDO --- */}
        <g id="midground-left">
          <polygon points="545,545 545,280 622,328 622,520" fill={THEME.farBuilding} strokeWidth="2" />
          <polygon points="622,328 646,328 646,515 622,520" fill={THEME.midBuildingDark} strokeWidth="2" />
          <polygon points="562,338 582,350 582,386 562,375" fill={THEME.midBuildingDark} strokeWidth="1.6" />
          <polygon points="592,356 610,367 610,400 592,390" fill="url(#warmWindowGrad)" strokeWidth="1.6" />

          {/* Edificio intermedio con balcones de hierro */}
          <polygon points="402,592 402,165 545,255 545,545" fill={THEME.midBuilding} strokeWidth="2.2" />
          <polygon points="396,160 550,252 550,264 396,174" fill={THEME.fgTrim} strokeWidth="2" />

          <polygon points="426,218 458,238 458,302 426,284" fill={THEME.midBuildingDark} strokeWidth="1.8" />
          <polygon points="482,253 512,271 512,330 482,314" fill="url(#warmWindowGrad)" strokeWidth="1.8" />
          {/* Silueta leyendo junto a la ventana */}
          <path d="M 490 317 C 492 299, 501 297, 505 310 L 508 322 Z" fill={THEME.ink} stroke="none" />

          {/* Balcón de hierro forjado */}
          <polygon points="476,312 518,334 518,354 476,332" fill="none" stroke={THEME.ironDark} strokeWidth="2" />
          <line x1="486" y1="318" x2="486" y2="337" stroke={THEME.ironDark} strokeWidth="1.6" />
          <line x1="497" y1="323" x2="497" y2="343" stroke={THEME.ironDark} strokeWidth="1.6" />
          <line x1="508" y1="329" x2="508" y2="348" stroke={THEME.ironDark} strokeWidth="1.6" />
        </g>

        {/* --- BLOQUE INTERMEDIO DERECHO --- */}
        <g id="midground-right">

              {/* Sombra lateral del abrigo */}
              <path
                d="M -22 -86 C -26 -58, -27 -24, -25 6 L -10 6 C -12 -24, -12 -58, -10 -86 Z"
                fill={THEME.coatShade}
                stroke="none"
              />
              <path
                d="M -22 -86 C -26 -58, -27 -24, -25 6 L 23 6 C 26 -24, 23 -58, 17 -86 Z"
                fill="none"
              />
              {/* Bolsillo lateral y botones */}
              <path d="M -6 -28 L 10 -28 L 9 -10 L -5 -10 Z" fill={THEME.coatShade} strokeWidth="1.8" />
              <circle cx="14" cy="-64" r="2.2" fill={THEME.beanieMain} strokeWidth="1.5" />
              <circle cx="15" cy="-42" r="2.2" fill={THEME.beanieMain} strokeWidth="1.5" />

              {/* Bufanda terracota envolvente y extremo flotante (scarfTail) */}
              <g id="scarfTail" transform={`translate(-14, -80) rotate(${g.scarfTailAngle})`}>
                <path
                  d="M 0 0 C -14 14, -22 32, -16 48 L -4 45 C -8 30, -2 14, 8 4 Z"
                  fill={THEME.scarfShade}
                />
                <PivotMarker />
              </g>
              <path
                d="M -16 -92 C -4 -88, 10 -88, 20 -92 L 22 -78 C 8 -74, -6 -74, -18 -78 Z"
                fill={THEME.scarfMain}
              />

              {/* 5. CUELLO, CABEZA Y CABELLO CON FOLLOW-THROUGH */}
              <g id="neck" transform={`translate(2, -90) rotate(${g.headTilt})`}>
                <path d="M -6 -12 L 6 -12 L 7 2 L -7 2 Z" fill={THEME.skin} />

                {/* Masa posterior del cabello castaño oscuro */}
                <g id="hairBack" transform={`translate(-10, -34) rotate(${g.hairBackSway})`}>
                  <path
                    d="M 0 -8 C -18 2, -26 28, -22 54 C -20 66, -25 76, -15 82 C -7 86, 1 76, 4 64 C 8 70, 14 66, 13 52 L 10 8 Z"
                    fill={THEME.hairDark}
                  />
                  <PivotMarker />
                </g>

                {/* Cabeza / Rostro */}
                <g id="head">
                  <path
                    d="M -10 -44 C -10 -53, 15 -53, 17 -38 C 18 -32, 21 -27, 22 -24 C 22 -22, 19 -21, 18 -20 C 18 -13, 15 -7, 8 -7 C 0 -7, -8 -11, -10 -22 Z"
                    fill={THEME.skin}
                  />

                  {/* Ceja y ojo expresivo (mira hacia abajo al perro durante la interacción) */}
                  <path
                    d={`M 9 ${-36 + g.eyeLookDown * 1.5} Q 13 ${-38 + g.eyeLookDown * 1.5} 16 ${-36 + g.eyeLookDown * 1.5}`}
                    fill="none"
                    strokeWidth="1.8"
                  />
                  <ellipse
                    cx={13 + g.eyeLookDown * 0.6}
                    cy={-30.5 + g.eyeLookDown * 1.8}
                    rx="1.9"
                    ry="2.4"
                    fill={THEME.ink}
                    stroke="none"
                  />
                  <circle
                    cx={13.5 + g.eyeLookDown * 0.6}
                    cy={-31.3 + g.eyeLookDown * 1.8}
                    r="0.7"
                    fill="#FFFFFF"
                    stroke="none"
                  />

                  {/* Boca: sonrisa tranquila que se acentúa al mirar al perro */}
                  {g.isSmiling ? (
                    <path d="M 10 -16 Q 14.5 -12.5 17.5 -16" fill="none" strokeWidth="1.9" />
                  ) : (
                    <path d="M 11 -16 Q 14.5 -15 16.5 -16.5" fill="none" strokeWidth="1.8" />
                  )}
                  <ellipse cx="7.5" cy="-21.5" rx="3.2" ry="1.7" fill="#E08979" stroke="none" opacity="0.55" />

                  {/* Mechón frontal de cabello */}
                  <g id="hairFront" transform={`translate(-12, -40) rotate(${g.hairFrontSway})`}>
                    <path
                      d="M 0 0 C -2 16, 2 34, 9 44 C 13 36, 13 22, 10 12 C 14 14, 16 8, 14 0 Z"
                      fill={THEME.hairDark}
                    />
                  </g>

                  {/* Gorro tejido ocre/mostaza */}
                  <g id="beanie">
                    <path
                      d="M -18 -40 C -24 -57, -12 -73, 6 -69 C 17 -66, 21 -53, 17 -41 Z"
                      fill={THEME.beanieMain}
                    />
                    <path
                      d="M -20 -43 C -8 -47, 8 -46, 19 -40 L 17 -33 C 6 -38, -8 -39, -18 -35 Z"
                      fill={THEME.beanieRib}
                    />
                    <line x1="-10" y1="-44" x2="-9" y2="-36" strokeWidth="1.5" />
                    <line x1="-1" y1="-45" x2="0" y2="-37" strokeWidth="1.5" />
                    <line x1="8" y1="-44" x2="8" y2="-36" strokeWidth="1.5" />
                  </g>
                </g>
                <PivotMarker label="head" />
              </g>

              {/* 6. BRAZO IZQUIERDO (Sostiene la correa en primer plano) */}
              <g id="armL" transform={`translate(4, -76) rotate(${g.armLAngle})`}>
                <path
                  d="M -7 0 C -6 20, -2 38, 4 54 L 15 51 C 10 34, 8 18, 7 -2 Z"
                  fill={THEME.coatMain}
                />
                <g id="forearmL" transform={`translate(9, 52) rotate(${g.forearmLAngle})`}>
                  <path
                    d="M -5 0 C -2 18, 8 34, 22 48 L 30 41 C 18 28, 10 14, 6 -2 Z"
                    fill={THEME.coatMain}
                  />
                  {/* Mano (handL) */}
                  <g id="handL" transform="translate(26, 45)">
                    <path
                      d="M -3 -2 C 2 -5, 10 -2, 9 4 C 8 9, 0 9, -4 4 Z"
                      fill={THEME.skin}
                    />
                    {/* Asa de la correa */}
                    <path
                      d="M 3 6 C 1 17, 9 23, 12 15 C 14 10, 9 5, 5 5"
                      fill="none"
                      stroke={THEME.ink}
                      strokeWidth="2.4"
                    />
                    <PivotMarker label="handL" />
                  </g>
                  <PivotMarker />
                </g>
                <PivotMarker />
              </g>
              <PivotMarker label="torso" />
            </g>
            <PivotMarker label="pelvis" />
          </g>
        </g>
      );
    };

    /**
     * ============================================================================
     * CAPA 7: PERRO SALCHICHA ARTICULADO + CORREA DINÁMICA (DogRig & DynamicLeash)
     * ============================================================================
     */
    const DogAndLeashLayer = ({ dog, leash, showPivots }) => {
      // Cálculo de catenaria elástica con inercia entre la mano de la chica y el collar
      const midX = (leash.startX + leash.endX) * 0.5;
      const dist = Math.hypot(leash.endX - leash.startX, leash.endY - leash.startY);
      const sag = Math.max(14, 58 - dist * 0.16) + leash.swing;
      const ctrl1X = leash.startX + (leash.endX - leash.startX) * 0.32;
      const ctrl1Y = leash.startY + sag * 1.15;
      const ctrl2X = leash.startX + (leash.endX - leash.startX) * 0.72;
      const ctrl2Y = leash.endY + sag * 0.55;

      const leashD = `M ${leash.startX.toFixed(1)} ${leash.startY.toFixed(1)} C ${ctrl1X.toFixed(1)} ${ctrl1Y.toFixed(1)}, ${ctrl2X.toFixed(1)} ${ctrl2Y.toFixed(1)}, ${leash.endX.toFixed(1)} ${leash.endY.toFixed(1)}`;

      const PivotDot = () =>
        showPivots ? (
          <circle cx="0" cy="0" r="3.5" fill="#FF6B6B" stroke="#050B16" strokeWidth="1.4" pointerEvents="none" />
        ) : null;

      return (
        <g id="DogAndLeashLayer">
          {/* Correa curva Bézier dinámica */}
          <path
            id="DynamicLeash"
            d={leashD}
            fill="none"
            stroke={THEME.ink}
            strokeWidth="2.5"
            strokeLinecap="round"
          />

          {/* Rig del Perro Salchicha (Dachshund) */}
          <g
            id="DogRig"
            transform={`translate(${dog.x}, ${dog.y})`}
            stroke={THEME.ink}
            strokeWidth="2.2"
            strokeLinejoin="round"
            strokeLinecap="round"
          >
            {/* Sombra de contacto */}
            <ellipse cx="0" cy="36" rx="52" ry="6.5" fill="#071326" stroke="none" opacity="0.68" />

            {/* Patas traseras (lado lejano y cercano) */}
            <g id="backLegR" transform={`translate(-32, 12) rotate(${dog.backR})`}>
              <path d="M -5 0 L 5 0 L 4 17 L 9 20 L -4 20 Z" fill={THEME.dogCoatShade} />
              <PivotDot />
            </g>
            <g id="backLegL" transform={`translate(-24, 12) rotate(${dog.backL})`}>
              <path d="M -5.5 0 L 5.5 0 L 4.5 18 L 10 21 L -4 21 Z" fill={THEME.dogTan} />
              <PivotDot />
            </g>

            {/* Patas delanteras (lado lejano y cercano) */}
            <g id="frontLegR" transform={`translate(22, 12) rotate(${dog.frontR})`}>
              <path d="M -5 0 L 5 0 L 4 17 L 9 20 L -3 20 Z" fill={THEME.dogCoatShade} />
              <PivotDot />
            </g>
            <g id="frontLegL" transform={`translate(30, 12) rotate(${dog.frontL})`}>
              <path d="M -5.5 0 L 5.5 0 L 4.5 18 L 10 21 L -3 21 Z" fill={THEME.dogTan} />
              <PivotDot />
            </g>

            {/* Cuerpo alargado característico de perro salchicha */}
            <g id="dogBody" transform={`rotate(${dog.spineTilt})`}>
              {/* Cola articulada */}
              <g id="dogTail" transform={`translate(-38, -2) rotate(${dog.tailAngle})`}>
                <path
                  d="M 0 2 C -14 -4, -22 -14, -20 -22 C -15 -20, -8 -10, 2 -3 Z"
                  fill={THEME.dogCoat}
                />
                <PivotDot />
              </g>

              {/* Torso alargado con pecho canela */}
              <path
                d="M -38 -4 C -22 -8, 14 -9, 34 -6 C 42 -4, 44 6, 38 14 C 24 17, -20 17, -36 13 C -42 10, -42 0, -38 -4 Z"
                fill={THEME.dogCoat}
              />
              {/* Mancha canela en pecho */}
              <path
                d="M 26 -5 C 38 -4, 43 5, 37 13 C 30 14, 24 11, 24 4 Z"
                fill={THEME.dogTan}
                stroke="none"
              />
              <path
                d="M -38 -4 C -22 -8, 14 -9, 34 -6 C 42 -4, 44 6, 38 14 C 24 17, -20 17, -36 13 C -42 10, -42 0, -38 -4 Z"
                fill="none"
              />

              {/* Cuello, Collar con Chapa y Cabeza */}
              <g id="dogNeck" transform={`translate(32, -6) rotate(${dog.neckAngle})`}>
                <path d="M -8 4 L -4 -14 L 12 -12 L 10 8 Z" fill={THEME.dogCoat} />
                {/* Collar rojo coral y chapa dorada */}
                <path d="M -6 -6 L 11 -4 L 10 2 L -7 0 Z" fill={THEME.dogCollar} />
                <circle cx="9" cy="3" r="3" fill={THEME.dogTag} strokeWidth="1.5" />

                <g id="dogHead" transform={`translate(4, -14) rotate(${dog.headAngle})`}>
                  {/* Cabeza estilizada dachshund */}
                  <path
                    d="M -12 2 C -14 -10, -2 -16, 10 -12 C 18 -10, 30 -7, 33 -2 C 34 3, 26 7, 16 7 L -6 7 Z"
                    fill={THEME.dogCoat}
                  />
                  {/* Hocico canela */}
                  <path
                    d="M 12 -6 C 20 -6, 30 -5, 32 -1 C 32 3, 24 6, 14 6 Z"
                    fill={THEME.dogTan}
                    stroke="none"
                  />
                  <path
                    d="M -12 2 C -14 -10, -2 -16, 10 -12 C 18 -10, 30 -7, 33 -2 C 34 3, 26 7, 16 7 L -6 7 Z"
                    fill="none"
                  />
                  {/* Trufa oscura */}
                  <ellipse cx="32.5" cy="-2.5" rx="3.2" ry="2.4" fill={THEME.ink} stroke="none" />
                  {/* Ojo expresivo mirando hacia la protagonista en la interacción */}
                  <circle
                    cx={11 - dog.eyeLookUp * 1.4}
                    cy={-5 - dog.eyeLookUp * 1.2}
                    r="2.4"
                    fill={THEME.ink}
                    stroke="none"
                  />
                  <circle
                    cx={11.6 - dog.eyeLookUp * 1.4}
                    cy={-5.8 - dog.eyeLookUp * 1.2}
                    r="0.8"
                    fill="#FFFFFF"
                    stroke="none"
                  />
                  {/* Oreja larga caída con movimiento secundario de rebote */}
                  <g id="dogEar" transform={`translate(-2, -8) rotate(${dog.earFlop})`}>
                    <path
                      d="M -4 0 C -10 8, -12 22, -4 26 C 3 28, 7 16, 4 2 Z"
                      fill={THEME.dogCoatShade}
                    />
                    <PivotDot />
                  </g>
                  <PivotDot />
                </g>
                <PivotDot />
              </g>
              <PivotDot />
            </g>
          </g>
        </g>
      );
    };

    /**
     * ============================================================================
     * CAPA 8: MARCO EDITORIAL Y VIÑETA NOCTURNA
     * ============================================================================
     */
    const FramingOverlayLayer = () => (
      <g id="FramingOverlayLayer" pointerEvents="none">
        <rect x="0" y="778" width="1440" height="32" fill="#050B16" opacity="0.26" />
        <rect x="1.5" y="1.5" width="1437" height="807" fill="none" stroke={THEME.ink} strokeWidth="3" />
      </g>
    );

    /**
     * ============================================================================
     * COMPONENTE PRINCIPAL CON SISTEMA TEMPORAL CENTRALIZADO (requestAnimationFrame)
     * ============================================================================
     */
    const App = () => {
      const [isPlaying, setIsPlaying] = useState(true);
      const [playbackSpeed, setPlaybackSpeed] = useState(1.0);
      const [currentTime, setCurrentTime] = useState(0);
      const [showPivots, setShowPivots] = useState(false);
      const [showLayersPanel, setShowLayersPanel] = useState(false);
      const [layers, setLayers] = useState({
        sky: true,
        midground: true,
        storefronts: true,
        street: true,
        props: true,
        protagonist: true,
        dog: true
      });

      const lastFrameRef = useRef(null);

      // Bucle maestro continuo de 9.0 segundos con continuidad matemática exacta
      useEffect(() => {
        if (!isPlaying) {
          lastFrameRef.current = null;
          return;
        }

        let rafId;
        const tick = (now) => {
          if (lastFrameRef.current !== null) {
            const dt = (now - lastFrameRef.current) / 1000;
            setCurrentTime((prev) => (prev + dt * playbackSpeed) % LOOP_DURATION);
          }
          lastFrameRef.current = now;
          rafId = requestAnimationFrame(tick);
        };

        rafId = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(rafId);
      }, [isPlaying, playbackSpeed]);

      const rigState = useMemo(() => evaluateRigState(currentTime), [currentTime]);

      // Etiqueta narrativa del momento actual en la línea de tiempo
      const narrativeBeat = useMemo(() => {
        if (currentTime >= 3.2 && currentTime <= 6.6) return 'Cruce de miradas';
        if (currentTime > 6.6) return 'Paso sincronizado';
        return 'Caminata tranquila';
      }, [currentTime]);

      const handleReset = () => {
        setCurrentTime(0);
        lastFrameRef.current = null;
      };

      const handleScrub = (e) => {
        const val = parseFloat(e.target.value);
        setCurrentTime(val);
        lastFrameRef.current = null;
      };

      const toggleLayer = (key) => {
        setLayers((prev) => ({ ...prev, [key]: !prev[key] }));
      };

      return (
        <div className="viewport-stage">
          {/* Escenario Cinematográfico 16:9 */}
          <div className="canvas-frame">
            <svg
              id="urban-narrative-animated-svg"
              className="narrative-scene"
              viewBox="0 0 1440 810"
              preserveAspectRatio="xMidYMid meet"
              xmlns="http://www.w3.org/2000/svg"
            >
              <SceneDefs />

              {layers.sky && <SkyLayer env={rigState.env} />}
              {layers.midground && <MidgroundArchitectureLayer />}
              {layers.street && <StreetAndSidewalksLayer />}
              {layers.storefronts && <StorefrontsLayer env={rigState.env} />}
              {layers.props && <StreetPropsLayer env={rigState.env} />}
              {layers.protagonist && <ProtagonistRig g={rigState.girl} showPivots={showPivots} />}
              {layers.dog && (
                <DogAndLeashLayer
                  dog={rigState.dog}
                  leash={rigState.leash}
                  showPivots={showPivots}
                />
              )}
              <FramingOverlayLayer />
            </svg>
          </div>

          {/* Popover opcional de visibilidad de capas */}
          {showLayersPanel && (
            <div className="layers-popover">
              <h4>Capas Vectoriales SVG</h4>
              {[
                { key: 'sky', label: '1. Cielo y Horizonte' },
                { key: 'midground', label: '2. Edificios Intermedios' },
                { key: 'street', label: '3. Calzada y Aceras' },
                { key: 'storefronts', label: '4. Escaparates Cálidos' },
                { key: 'props', label: '5. Farolas y Ambiente' },
                { key: 'protagonist', label: '6. Protagonista Rig' },
                { key: 'dog', label: '7. Perro Salchicha + Correa' }
              ].map((item) => (
                <label key={item.key} className="layer-row">
                  <span>{item.label}</span>
                  <input
                    type="checkbox"
                    checked={layers[item.key]}
                    onChange={() => toggleLayer(item.key)}
                  />
                </label>
              ))}
            </div>
          )}

          {/* Barra flotante minimalista de reproducción y línea de tiempo */}
          <div className="production-bar">
            <button
              type="button"
              className="ctrl-btn primary"
              onClick={() => setIsPlaying((p) => !p)}
              title={isPlaying ? 'Pausar animación' : 'Reproducir animación'}
            >
              {isPlaying ? '⏸ Pausar' : '▶ Reproducir'}
            </button>

            <button
              type="button"
              className="ctrl-btn"
              onClick={handleReset}
              title="Reiniciar ciclo a 0.0s"
            >
              ↺ Reiniciar
            </button>

            <div className="timeline-box">
              <div className="timeline-meta">
                <span className="beat-badge">{narrativeBeat}</span>
                <span>{currentTime.toFixed(1)}s / {LOOP_DURATION.toFixed(1)}s</span>
              </div>
              <input
                type="range"
                className="scrubber"
                min="0"
                max={LOOP_DURATION}
                step="0.02"
                value={currentTime}
                onChange={handleScrub}
              />
            </div>

            <div className="speed-group" title="Velocidad de reproducción">
              {[0.5, 1.0, 1.5].map((spd) => (
                <button
                  key={spd}
                  type="button"
                  className={`speed-pill ${playbackSpeed === spd ? 'active' : ''}`}
                  onClick={() => setPlaybackSpeed(spd)}
                >
                  {spd}x
                </button>
              ))}
            </div>

            <button
              type="button"
              className={`ctrl-btn ${showPivots ? 'active-toggle' : ''}`}
              onClick={() => setShowPivots((v) => !v)}
              title="Mostrar nodos de articulación del rig"
            >
              Pivotes
            </button>

            <button
              type="button"
              className={`ctrl-btn ${showLayersPanel ? 'active-toggle' : ''}`}
              onClick={() => setShowLayersPanel((v) => !v)}
              title="Inspeccionar capas SVG"
            >
              Capas
            </button>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
