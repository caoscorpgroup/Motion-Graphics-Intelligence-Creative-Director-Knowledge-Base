<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#061713">
<title>The Luminous Wilds — Ecosistema bioluminiscente</title>
<style>
:root{color-scheme:dark;--cyan:#79ffe2;--mint:#a5ffbd;--panel:rgba(3,20,19,.78)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061713;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e2fff4;touch-action:none}
#world{position:absolute;inset:0;width:100%;height:100%;display:block}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 38%,rgba(0,8,8,.22) 100%),linear-gradient(180deg,rgba(1,12,13,.18),transparent 35%,rgba(1,9,10,.3))}
header{position:absolute;top:env(safe-area-inset-top,12px);left:0;right:0;padding:18px 20px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;text-shadow:0 2px 14px #00110e}
.brand{font-size:clamp(17px,3vw,25px);font-weight:650;letter-spacing:.16em}.sub{font-size:10px;letter-spacing:.28em;color:#a4d9c9;margin-top:5px}.status{font-size:10px;letter-spacing:.16em;color:#a9e8d4;border:1px solid #9af7d333;border-radius:30px;padding:7px 11px;background:#031b18a8}
#panel{position:absolute;right:14px;top:90px;width:min(238px,43vw);padding:14px 14px 12px;background:var(--panel);border:1px solid #8af4d32b;border-radius:14px;backdrop-filter:blur(12px);box-shadow:0 10px 40px #0005;transition:transform .25s,opacity .25s;max-height:calc(100% - 180px);overflow:auto}
#panel.hidden{transform:translateX(calc(100% + 20px));opacity:0;pointer-events:none}.panel-title{font-size:10px;letter-spacing:.22em;color:#9be9d2;margin-bottom:13px}.control{margin:12px 0}.control label{display:flex;justify-content:space-between;font-size:11px;color:#c4e8dc;margin-bottom:7px}.control output{color:#8fffe0;font-variant-numeric:tabular-nums}input[type=range]{width:100%;accent-color:#7dffdb;height:18px}.actions{display:flex;gap:7px;margin-top:13px}.actions button,#toggle{border:1px solid #8bf4d34a;background:#0a3029;color:#d9fff2;border-radius:9px;padding:9px 11px;font-size:11px;cursor:pointer;min-height:36px}.actions button:active,#toggle:active{background:#175344}#toggle{position:absolute;right:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));padding:11px 14px;background:#061d19d9;backdrop-filter:blur(10px)}
footer{position:absolute;left:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));font-size:9px;letter-spacing:.16em;color:#a3cbbd99;pointer-events:none}.hint{position:absolute;left:50%;bottom:calc(19px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-size:10px;color:#b4e9d9aa;letter-spacing:.12em;white-space:nowrap;pointer-events:none}
#start{position:absolute;inset:0;display:grid;place-items:center;background:#061713;z-index:5;transition:opacity .4s}.start-card{text-align:center;padding:28px}.start-card h1{font-size:clamp(22px,5vw,38px);font-weight:500;letter-spacing:.18em;margin:0 0 10px}.start-card p{font-size:12px;letter-spacing:.1em;color:#9dcbbb;margin:0 0 22px}.start-card button{border:1px solid #91f5d477;background:#0b342b;color:#dcfff3;border-radius:30px;padding:13px 24px;font-size:12px;letter-spacing:.16em}
@media(max-width:600px){header{padding:14px}.status{font-size:8px}#panel{top:76px;right:9px;width:min(218px,53vw);padding:11px}footer{display:none}.hint{font-size:8px;bottom:calc(22px + env(safe-area-inset-bottom,0px))}}
</style>
</head>
<body>
<canvas id="world" aria-label="Ecosistema bioluminiscente animado"></canvas><div class="vignette"></div>
<header><div><div class="brand">THE LUMINOUS WILDS</div><div class="sub">A LIVING BIOLUMINESCENT ECOSYSTEM</div></div><div class="status" id="state">● ECOSYSTEM ACTIVE</div></header>
<section id="panel"><div class="panel-title">ENVIRONMENT CONTROL</div>
<div class="control"><label for="wind">Viento <output id="windVal">42%</output></label><input id="wind" type="range" min="0" max="100" value="42"></div>
<div class="control"><label for="glow">Bioluminiscencia <output id="glowVal">78%</output></label><input id="glow" type="range" min="0" max="100" value="78"></div>
<div class="control"><label for="life">Vida suspendida <output id="lifeVal">65%</output></label><input id="life" type="range" min="0" max="100" value="65"></div>
<div class="control"><label for="water">Pulso del agua <output id="waterVal">55%</output></label><input id="water" type="range" min="0" max="100" value="55"></div>
<div class="actions"><button id="pause">Pausar</button><button id="reset">Reiniciar</button></div></section>
<button id="toggle">CONTROLES</button><footer>GENERATIVE ENVIRONMENT · REAL-TIME CANVAS</footer><div class="hint">TOCA EL AGUA PARA DESPERTAR EL ECOSISTEMA</div>
<div id="start"><div class="start-card"><h1>THE LUMINOUS WILDS</h1><p>Un ecosistema vivo en la oscuridad</p><button id="enter">ENTRAR EN EL ECOSISTEMA</button></div></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('world'),ctx=canvas.getContext('2d',{alpha:false});
const $=id=>document.getElementById(id);let W=0,H=0,D=1,now=0,last=0,paused=false,started=false,wind=.42,glow=.78,life=.65,water=.55,pointer={x:.5,y:.5,active:false},ripples=[];
let stars=[],specks=[],plants=[],trees=[],roots=[],motes=[],fireflies=[];
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){D=Math.min(devicePixelRatio||1,1.7);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*D);canvas.height=Math.round(H*D);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(D,0,0,D,0,0);build();}
function build(){stars=Array.from({length:Math.floor(W*H/6500)},()=>({x:rand(0,W),y:rand(0,H*.62),r:rand(.3,1.5),a:rand(.15,.7),p:rand(0,7)}));specks=Array.from({length:Math.floor(W*H/1700)},()=>({x:rand(0,W),y:rand(0,H),z:rand(.25,1),r:rand(.5,2),p:rand(0,7),s:rand(.1,.55)}));plants=[];for(let i=0;i<Math.floor(W/15);i++){let x=rand(-20,W+20),base=H*rand(.68,.91),depth=rand(.35,1);plants.push({x,base,h:rand(H*.08,H*.29)*depth,w:rand(7,19)*depth,depth,phase:rand(0,7),type:Math.floor(rand(0,4)),hue:rand(155,195)});}trees=[];for(let i=0;i<Math.max(8,Math.floor(W/100));i++){let x=rand(-60,W+60),base=H*rand(.58,.78),depth=rand(.25,.72);trees.push({x,base,h:rand(H*.18,H*.43)*depth,w:rand(35,80)*depth,depth,phase:rand(0,7),branches:Math.floor(rand(4,8))});}roots=[];for(let i=0;i<24;i++)roots.push({x:rand(0,W),y:H*rand(.76,.97),len:rand(35,170),phase:rand(0,7),dir:Math.random()<.5?-1:1});motes=Array.from({length:Math.floor(W*H/900)},()=>({x:rand(0,W),y:rand(0,H),vx:rand(-.25,.25),vy:rand(-.35,-.05),r:rand(.7,2.2),phase:rand(0,7),z:rand(.4,1)}));fireflies=Array.from({length:Math.floor(W/24)},()=>({x:rand(0,W),y:rand(H*.25,H*.78),phase:rand(0,7),r:rand(1.2,3.3),orbit:rand(8,35),speed:rand(.25,.8)}));}
function glowDot(x,y,r,color,a=1){ctx.save();ctx.globalAlpha=a;ctx.shadowBlur=r*7;ctx.shadowColor=color;ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.restore();}
function background(t){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#061a1c');g.addColorStop(.38,'#092725');g.addColorStop(.72,'#0b2924');g.addColorStop(1,'#041311');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
let haze=ctx.createRadialGradient(W*.52,H*.47,0,W*.52,H*.47,W*.62);haze.addColorStop(0,`rgba(31,112,93,${.16*glow})`);haze.addColorStop(1,'rgba(4,18,17,0)');ctx.fillStyle=haze;ctx.fillRect(0,0,W,H);
for(const s of stars){let a=s.a*(.65+.35*Math.sin(t*.7+s.p));glowDot(s.x,s.y,s.r,'#a9ffe7',a*.7);}}
function drawRidge(points,color){ctx.beginPath();ctx.moveTo(points[0][0],H);for(const p of points)ctx.lineTo(p[0],p[1]);ctx.lineTo(W,H);ctx.closePath();ctx.fillStyle=color;ctx.fill();}
function landscape(t){let far=[],mid=[];for(let x=-20;x<=W+40;x+=W/14){far.push([x,H*.53+Math.sin(x*.006+t*.025)*H*.035+Math.sin(x*.017)*H*.012]);mid.push([x,H*.65+Math.sin(x*.009+2)*H*.035+Math.sin(x*.022+t*.02)*H*.012]);}drawRidge(far,'#0a2825');drawRidge(mid,'#0a211e');
// distant luminous canopy
for(let i=0;i<32;i++){let x=(i/31)*W+Math.sin(i*8)*12,y=H*.51+Math.sin(i*2.3)*H*.025;glowDot(x,y,rand(2,4),'#35b99b',.08*glow);}}
function waterSurface(t){let y0=H*.73;let g=ctx.createLinearGradient(0,y0,0,H);g.addColorStop(0,'rgba(10,76,66,.76)');g.addColorStop(.3,'rgba(5,45,43,.88)');g.addColorStop(1,'rgba(2,17,18,.98)');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(0,y0);for(let x=0;x<=W+8;x+=8){let y=y0+Math.sin(x*.012+t*.65)*5*water+Math.sin(x*.027-t*.42)*2.8*water;ctx.lineTo(x,y);}ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();
ctx.save();ctx.globalCompositeOperation='screen';for(let i=0;i<22;i++){let x=(i/21)*W,y=y0+Math.sin(i*1.8+t*.65)*4*water;ctx.strokeStyle=`rgba(87,245,207,${(.035+glow*.06)*(0.5+0.5*Math.sin(t+i))})`;ctx.lineWidth=1+((i%3)*.4);ctx.beginPath();ctx.moveTo(x-35,y);ctx.quadraticCurveTo(x,y-4,x+42,y+1);ctx.stroke();}ctx.restore();
for(const r of ripples){let p=(t-r.t)*.5;if(p<0||p>1.8)continue;ctx.save();ctx.globalAlpha=(1-p/1.8)*.5;ctx.strokeStyle='#79ffe1';ctx.lineWidth=1.2;ctx.shadowBlur=14;ctx.shadowColor='#65ffdc';ctx.beginPath();ctx.ellipse(r.x,r.y,p*85+4,p*20+2,0,0,Math.PI*2);ctx.stroke();ctx.restore();}}
function drawTree(o,t){let sway=Math.sin(t*.55*wind+o.phase)*o.w*.07;let x=o.x,y=o.base,h=o.h;ctx.save();ctx.lineCap='round';ctx.strokeStyle=`rgba(14,49,39,${.85})`;ctx.lineWidth=Math.max(2,o.w*.13);ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x+sway*.4,y-h*.55,x+sway,y-h);ctx.stroke();for(let j=0;j<o.branches;j++){let f=.22+j/o.branches*.66,by=y-h*f,bx=x+sway*f,side=j%2?1:-1,len=o.w*(.45+f*.5);ctx.strokeStyle='#174c3d';ctx.lineWidth=Math.max(1,o.w*.045);ctx.beginPath();ctx.moveTo(bx,by);ctx.quadraticCurveTo(bx+side*len*.45,by-h*.06,bx+side*len,by-h*.16);ctx.stroke();for(let k=0;k<5;k++){let lx=bx+side*len*(.45+k*.13),ly=by-h*(.08+k*.012);ctx.fillStyle=`rgba(17,74,55,${.8})`;ctx.beginPath();ctx.ellipse(lx,ly,o.w*.09,o.w*.035,side*.35,0,Math.PI*2);ctx.fill();if(k%2===0)glowDot(lx,ly,o.depth*1.8,'#52eec2',glow*(.18+.13*Math.sin(t*1.4+j+k)));}}ctx.restore();}
function drawPlant(o,t){let sway=Math.sin(t*(.7+wind)+o.phase)*o.w*.65*wind,base=o.base,h=o.h,x=o.x;ctx.save();ctx.lineCap='round';ctx.strokeStyle=o.type===2?'#246c51':'#185b49';ctx.lineWidth=Math.max(1.2,o.w*.13);ctx.beginPath();ctx.moveTo(x,base);ctx.quadraticCurveTo(x+sway*.25,base-h*.48,x+sway,base-h);ctx.stroke();let leaves=o.type===1?7:5;for(let j=0;j<leaves;j++){let f=(j+1)/(leaves+1),px=x+sway*f,py=base-h*f,side=(j%2?1:-1),ll=o.w*(.5+Math.sin(j*2)*.18);ctx.save();ctx.translate(px,py);ctx.rotate(side*(.5+wind*.13)+Math.sin(t+o.phase+j)*.08);ctx.fillStyle=o.type===3?'#1e6550':'#1c7459';ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(side*ll*.4,-ll*.8,side*ll,-ll*.15);ctx.quadraticCurveTo(side*ll*.45,ll*.25,0,0);ctx.fill();if((j+o.type)%2===0){ctx.strokeStyle=`rgba(91,255,211,${.28*glow})`;ctx.lineWidth=.7;ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(side*ll*.5,-ll*.15,side*ll*.88,-ll*.16);ctx.stroke();glowDot(side*ll*.82,-ll*.16,Math.max(.8,o.depth*1.9),'#69ffd6',glow*(.28+.18*Math.sin(t*1.5+o.phase+j)));}ctx.restore();}
if(o.type===2){let bx=x+sway,by=base-h;for(let k=0;k<3;k++){let a=t*.7+o.phase+k*2.1;glowDot(bx+Math.sin(a)*o.w*.55,by-h*.16+Math.cos(a)*o.w*.25,o.depth*2.2,'#a0ffb6',glow*.55);}}
ctx.restore();}
function drawRoots(t){ctx.save();ctx.globalCompositeOperation='screen';for(const r of roots){ctx.beginPath();ctx.moveTo(r.x,r.y);ctx.bezierCurveTo(r.x+r.dir*r.len*.25,r.y-12+Math.sin(t+r.phase)*8,r.x+r.dir*r.len*.7,r.y+8,r.x+r.dir*r.len,r.y-24+Math.sin(t*.8+r.phase)*13);ctx.strokeStyle=`rgba(54,235,177,${.16*glow})`;ctx.lineWidth=1.5;ctx.shadowBlur=12;ctx.shadowColor='#43ffc4';ctx.stroke();for(let i=0;i<3;i++){let f=(i+1)/4,x=r.x+r.dir*r.len*f,y=r.y-12+Math.sin(t+r.phase+f)*8;glowDot(x,y,1.5,'#80ffcc',glow*.5);}}ctx.restore();}
function drawMotes(dt,t){ctx.save();ctx.globalCompositeOperation='screen';for(const p of motes){p.x+=p.vx*dt*60*(.5+wind);p.y+=p.vy*dt*60*(.5+wind);p.x+=Math.sin(t*.4+p.phase)*.16;if(p.y<-8){p.y=H+8;p.x=rand(0,W);}if(p.x<-8)p.x=W+8;if(p.x>W+8)p.x=-8;let a=(.2+.45*(.5+.5*Math.sin(t*1.4+p.phase)))*life*glow*p.z;glowDot(p.x,p.y,p.r,'#8affd9',a);}for(const f of fireflies){let x=f.x+Math.sin(t*f.speed+f.phase)*f.orbit,y=f.y+Math.cos(t*f.speed*.8+f.phase)*f.orbit*.55;let a=(.25+.75*(.5+.5*Math.sin(t*2+f.phase)))*life*glow;glowDot(x,y,f.r,'#b3ff9c',a);glowDot(x,y,f.r*3,'#6dffb7',a*.12);}ctx.restore();}
function draw(t,dt){background(t);landscape(t);for(const tr of trees.sort((a,b)=>a.depth-b.depth))drawTree(tr,t);waterSurface(t);drawRoots(t);for(const p of plants.sort((a,b)=>a.depth-b.depth))drawPlant(p,t);drawMotes(dt,t);}
function frame(ts){if(!started)return;requestAnimationFrame(frame);if(paused)return;let dt=Math.min(.04,(ts-last)/1000||.016);last=ts;now+=dt;draw(now,dt);ripples=ripples.filter(r=>now-r.t<3.7);}
function updateControls(){for(const [id,v] of [['wind',wind],['glow',glow],['life',life],['water',water]])$(id+'Val').textContent=Math.round(v*100)+'%';}
for(const id of ['wind','glow','life','water'])$(id).addEventListener('input',e=>{let v=+e.target.value/100;if(id==='wind')wind=v;if(id==='glow')glow=v;if(id==='life')life=v;if(id==='water')water=v;updateControls();});
$('toggle').addEventListener('click',()=>$('panel').classList.toggle('hidden'));
$('pause').addEventListener('click',()=>{paused=!paused;$('pause').textContent=paused?'Reanudar':'Pausar';$('state').textContent=paused?'Ⅱ ECOSYSTEM PAUSED':'● ECOSYSTEM ACTIVE';if(!paused){last=performance.now();}});
$('reset').addEventListener('click',()=>{wind=.42;glow=.78;life=.65;water=.55;for(const [id,v] of [['wind',42],['glow',78],['life',65],['water',55]])$(id).value=v;updateControls();ripples=[];now=0;});
function wake(e){let rect=canvas.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top;ripples.push({x,y,t:now});for(let i=0;i<8;i++)motes.push({x,y,vx:rand(-1.5,1.5),vy:rand(-1.8,.5),r:rand(1,2.4),phase:rand(0,7),z:1});if(motes.length>1800)motes.splice(0,motes.length-1800);}
canvas.addEventListener('pointerdown',e=>{pointer.x=e.clientX/W;pointer.y=e.clientY/H;pointer.active=true;wake(e);});canvas.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'&&e.buttons)wake(e);});
$('enter').addEventListener('click',()=>{started=true;$('start').style.opacity='0';setTimeout(()=>$('start').remove(),450);last=performance.now();requestAnimationFrame(frame);});
addEventListener('resize',resize,{passive:true});resize();updateControls();
})();
</script>
</body></html>
